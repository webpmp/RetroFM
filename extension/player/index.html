<!DOCTYPE html>
<html lang="en" class="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RetroFM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="player.css"></head><body class="dark">
<div id="rfmModal" class="rfm-modal-overlay">

</div>

<div id="logoBar" role="button" tabindex="0" aria-label="RetroFM logo: toggle light/dark"><img id="logo" alt="RetroFM" src="logos/1990s-black.png" style="display:block"><div id="fb"></div><span id="copy">© 2026 RetroFM by Chris Adkins<br>All Rights Reserved</span></div>
<div id="wrap"><div id="stage">
 <div class="reel" style="left:491px;top:334px;width:54px;height:54px;background-position:-491px -334px"></div>
 <div class="reel" style="left:593px;top:335px;width:54px;height:54px;background-position:-593px -335px"></div>
 <svg width="1408" height="768" viewBox="0 0 1408 768">
  <defs><clipPath id="cl"><rect x="780" y="280" width="113" height="73"/></clipPath><clipPath id="cr"><rect x="907" y="280" width="113" height="73"/></clipPath></defs>
  <g clip-path="url(#cl)"><line id="nl" x1="833" y1="352" x2="833" y2="300" stroke="#2a1608" stroke-width="2.4" stroke-linecap="round"/></g>

  <polygon id="gPlay" class="lit" points="433.2,555.2 433,563.8 448.2,559.4"/><polygon id="gStop" class="lit" points="486.2,556.2 498.1,556 497.9,563.1 485.3,562.9"/><g id="gPause"><polygon class="lit gp" points="538.1,555.5 542.3,555.9 541.3,563.4 537.3,563"/><polygon class="lit gp" points="546,555.3 549.4,555 548.8,562.8 545.3,563"/></g>
  <g id="gRewG"><polygon class="lit gRew" points="588,555.2 590.4,555.2 590.4,563.8 588,563.8"/><polygon class="lit gRew" points="590.6,559.4 603,555.2 603,563.8"/></g><polygon class="lit gFwd" points="638.2,555.8 638.2,561.2 646.5,558.5"/><polygon class="lit gFwd" points="646,555.8 646,561.2 658,558.5"/><ellipse class="lit rec gRec" cx="698.8" cy="559.4" rx="6" ry="4.4"/>

  <line id="tn" x1="683" y1="127" x2="683" y2="216" stroke="#d22a1c" stroke-width="3.5" style="filter:drop-shadow(0 0 3px rgba(210,40,28,.7))"/>
 </svg>
 <div class="hit btn" id="bPlay" role="button" aria-label="Play" tabindex="0" style="left:412px"></div>
 <div class="hit btn" id="bStop" role="button" aria-label="Stop" tabindex="0" style="left:465px"></div>
 <div class="hit btn" id="bPause" role="button" aria-label="Pause" tabindex="0" style="left:518px"></div>
 <div class="knob" id="kVol" tabindex="0" role="slider" aria-label="Volume" style="left:783px;top:503px;width:100px;height:100px;background-position:-783px -503px"></div>
 <div class="knob" id="kBal" tabindex="0" role="slider" aria-label="Balance" style="left:931px;top:509px;width:80px;height:80px;background-position:-931px -509px"></div>
 <div class="knob" id="kTun" tabindex="0" role="slider" aria-label="Tuning (year)" style="left:1069px;top:129px;width:96px;height:96px;background-position:-1069px -129px"></div>
</div></div>
<div id="panel" class="entry">
 <div id="board"><div class="bl" id="bDate">DATE</div><div id="fDate"></div><div class="bl" id="bGen" style="margin-top:8px">GENRE ▲▼</div><div id="fGen"></div><div id="bHint"></div><input id="dIn" autocomplete="off" spellcheck="false" maxlength="20" aria-label="Date"></div>

 <div id="row"><div id="year"></div><div id="freq"><span id="sg"></span><button id="sdot" aria-label="Toggle title and artist fade" title="Fade between title and artist (click to turn off)" aria-pressed="true">♫</button></div></div>
<div id="chips"></div>
 </div>
</div>
<script src="player.js"></script></body></html>
