<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      background: #12141a;
      color: #e2e8f0;
      margin: 0;
      box-sizing: border-box;
    }
    .logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 12px;
    }
    .logo-container img {
      max-width: 140px;
      height: auto;
      display: block;
    }
    h3 {
      margin: 0 0 8px 0;
      color: #f59e0b;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      text-align: center;
    }
    p {
      font-size: 12px;
      line-height: 1.4;
      color: #94a3b8;
      margin: 0 0 12px 0;
      text-align: center;
    }
    .status-container {
      display: flex;
      justify-content: center;
      margin-bottom: 12px;
    }
    .status {
      display: inline-block;
      padding: 4px 8px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 4px;
      font-size: 11px;
      color: #10b981;
    }
    footer {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #1f293d;
      font-size: 11px;
      color: #64748b;
      line-height: 1.5;
    }
    footer a {
      color: #f59e0b;
      text-decoration: none;
    }
    footer a:hover {
      text-decoration: underline;
    }
    .footer-links {
      margin-top: 4px;
      display: flex;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <img src="icons/icon-48.png" alt="RetroFM" width="48" height="48">
  </div>
  <h3 id="ext-title">RetroFM</h3>
  <p>Connects the RetroFM app to a YouTube tab for audio ducking and playback control.</p>
  <div class="status-container">
    <div class="status" id="ext-status">● Bridge Active</div>
  </div>

  <footer>
    <div><strong id="ext-name">RetroFM</strong> <span id="ext-ver"></span> by Chris Adkins</div>
    <div class="footer-links">
      <a href="https://github.com/webpmp/RetroFM" target="_blank" rel="noopener noreferrer">GitHub</a>
      <span>&bull;</span>
      <a href="https://github.com/webpmp/RetroFM/issues" target="_blank" rel="noopener noreferrer">Report an issue</a>
    </div>
  </footer>

  <script>
    try {
      const manifest = chrome?.runtime?.getManifest?.();
      const version = manifest?.version || '';
      if (version) {
        const verSpan = document.getElementById('ext-ver');
        if (verSpan) verSpan.textContent = 'v' + version;
        const statusDiv = document.getElementById('ext-status');
        if (statusDiv) statusDiv.textContent = '● Bridge Active (v' + version + ')';
      }
    } catch (e) {
      // Fallback
    }
  </script>
</body>
</html>
