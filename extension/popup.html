<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      background: #12141a;
      color: #e2e8f0;
      margin: 0;
    }
    h3 {
      margin: 0 0 8px 0;
      color: #f59e0b;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    p {
      font-size: 12px;
      line-height: 1.4;
      color: #94a3b8;
      margin: 0 0 12px 0;
    }
    .status {
      display: inline-block;
      padding: 4px 8px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 4px;
      font-size: 11px;
      color: #10b981;
    }
  </style>
</head>
<body>
  <h3>Retro FM Bridge</h3>
  <p>Permitted tab controller bridge for the Retro FM proof-of-concept experiment.</p>
  <div class="status">● Bridge Active (v1.0.4)</div>
</body>
</html>
